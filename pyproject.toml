[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "formalprompt"
version = "0.1.0"
description = "A browser canvas for externalized agent deliberation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "FormalPrompt contributors" },
]
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "google-re2>=1.1.20251105",
  "typer>=0.15,<1",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "pyyaml>=6,<7",
  "ruff>=0.11,<1",
]

[project.scripts]
formalprompt = "formalprompt.cli:app"
formalprompt-openai-assistant = "formalprompt.adapters.openai_compatible:main"
formalprompt-muse-assistant = "formalprompt.adapters.muse_runner:main"

[tool.hatch.build.targets.wheel]
packages = ["src/formalprompt"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning:fastapi.testclient",
  "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning:starlette.testclient",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
